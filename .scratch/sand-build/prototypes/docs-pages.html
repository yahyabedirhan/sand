<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sand docs prototype</title>
    <!-- PROTOTYPE, throwaway. Ticket 00. Three variants of the docs page format on
     five page kinds (Overview, Colors, Button, Primitives, Cards preview).
     ?variant=A|B|C  ?page=overview|colors|button|mechanic|preview  ?theme=dark -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --background: oklch(0.9755 0.0067 97.351);
        --foreground: oklch(0.2178 0 0);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.2178 0 0);
        --popover: oklch(1 0 0);
        --primary: oklch(0.7414 0.0738 84.5946);
        --primary-foreground: oklch(0.2178 0 0);
        --secondary: oklch(0.9096 0.0167 91.5611);
        --secondary-foreground: oklch(0.2178 0 0);
        --muted: oklch(0.9459 0.0165 91.5544);
        --muted-foreground: oklch(0.5022 0.0278 85.7741);
        --accent: oklch(0.7414 0.0738 84.5946);
        --accent-foreground: oklch(0.2178 0 0);
        --destructive: oklch(0.568 0.2002 26.4057);
        --destructive-foreground: oklch(1 0 0);
        --border: oklch(0.8986 0.0258 97.1423);
        --input: oklch(0.8986 0.0258 97.1423);
        --ring: oklch(0.7414 0.0738 84.5946);
        --chart-1: oklch(0.7414 0.0738 84.5946);
        --chart-2: oklch(0.3738 0.0116 258.366);
        --chart-3: oklch(0.9096 0.0167 91.5611);
        --chart-4: oklch(0.5933 0.0472 87.9063);
        --chart-5: oklch(0.2958 0.0084 255.5667);
        --sidebar: oklch(0.9459 0.0165 91.5544);
        --sidebar-accent: oklch(0.8986 0.0258 97.1423);
        --sidebar-border: oklch(0.8986 0.0258 97.1423);
        --radius: 0.75rem;
        --shadow-sm:
          0 8px 15px 0 hsl(0 0% 0%/0.05), 0 1px 2px -1px hsl(0 0% 0%/0.05);
        --shadow-lg:
          0 8px 15px 0 hsl(0 0% 0%/0.05), 0 4px 6px -1px hsl(0 0% 0%/0.05);
        --xs: 0.25rem;
        --sm: 0.5rem;
        --md: 1rem;
        --lg: 1.5rem;
        --xl: 2rem;
        --x2: 3rem;
      }
      .light {
        color-scheme: light;
        --background: oklch(0.9755 0.0067 97.351);
        --foreground: oklch(0.2178 0 0);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.2178 0 0);
        --popover: oklch(1 0 0);
        --primary: oklch(0.7414 0.0738 84.5946);
        --primary-foreground: oklch(0.2178 0 0);
        --secondary: oklch(0.9096 0.0167 91.5611);
        --secondary-foreground: oklch(0.2178 0 0);
        --muted: oklch(0.9459 0.0165 91.5544);
        --muted-foreground: oklch(0.5022 0.0278 85.7741);
        --accent: oklch(0.7414 0.0738 84.5946);
        --accent-foreground: oklch(0.2178 0 0);
        --destructive: oklch(0.568 0.2002 26.4057);
        --destructive-foreground: oklch(1 0 0);
        --border: oklch(0.8986 0.0258 97.1423);
        --input: oklch(0.8986 0.0258 97.1423);
        --ring: oklch(0.7414 0.0738 84.5946);
        --chart-1: oklch(0.7414 0.0738 84.5946);
        --chart-2: oklch(0.3738 0.0116 258.366);
        --chart-3: oklch(0.9096 0.0167 91.5611);
        --chart-4: oklch(0.5933 0.0472 87.9063);
        --chart-5: oklch(0.2958 0.0084 255.5667);
        --sidebar: oklch(0.9459 0.0165 91.5544);
        --sidebar-accent: oklch(0.8986 0.0258 97.1423);
        --sidebar-border: oklch(0.8986 0.0258 97.1423);
        --radius: 0.75rem;
        --shadow-sm:
          0 8px 15px 0 hsl(0 0% 0%/0.05), 0 1px 2px -1px hsl(0 0% 0%/0.05);
        --shadow-lg:
          0 8px 15px 0 hsl(0 0% 0%/0.05), 0 4px 6px -1px hsl(0 0% 0%/0.05);
        --xs: 0.25rem;
        --sm: 0.5rem;
        --md: 1rem;
        --lg: 1.5rem;
        --xl: 2rem;
        --x2: 3rem;
      }
      .dark {
        color-scheme: dark;
        --background: oklch(0.1904 0.004 106.7692);
        --foreground: oklch(0.9755 0.0067 97.351);
        --card: oklch(0.2343 0.0038 106.6863);
        --card-foreground: oklch(0.9755 0.0067 97.351);
        --popover: oklch(0.2343 0.0038 106.6863);
        --primary: oklch(0.8039 0.0702 84.7579);
        --primary-foreground: oklch(0.1904 0.004 106.7692);
        --secondary: oklch(0.2901 0.0061 78.232);
        --secondary-foreground: oklch(0.9755 0.0067 97.351);
        --muted: oklch(0.2596 0.0037 106.6523);
        --muted-foreground: oklch(0.7006 0.0154 84.5911);
        --accent: oklch(0.8039 0.0702 84.7579);
        --accent-foreground: oklch(0.1904 0.004 106.7692);
        --destructive: oklch(0.6368 0.2078 25.3313);
        --destructive-foreground: oklch(0.9755 0.0067 97.351);
        --border: oklch(0.2901 0.0061 78.232);
        --input: oklch(0.2901 0.0061 78.232);
        --ring: oklch(0.8039 0.0702 84.7579);
        --chart-1: oklch(0.8039 0.0702 84.7579);
        --chart-2: oklch(0.5498 0.0111 252.878);
        --chart-3: oklch(0.3142 0.006 78.2414);
        --chart-4: oklch(0.6926 0.0459 87.9527);
        --chart-5: oklch(0.217 0.0038 106.7146);
        --sidebar: oklch(0.1904 0.004 106.7692);
        --sidebar-accent: oklch(0.2901 0.0061 78.232);
        --sidebar-border: oklch(0.2901 0.0061 78.232);
        --shadow-sm:
          0 10px 25px 0 hsl(0 0% 0%/0.4), 0 1px 2px -1px hsl(0 0% 0%/0.4);
        --shadow-lg:
          0 10px 25px 0 hsl(0 0% 0%/0.4), 0 4px 6px -1px hsl(0 0% 0%/0.4);
      }
      * {
        box-sizing: border-box;
        border-color: var(--border);
      }
      body {
        margin: 0;
        font-family: Geist, system-ui, sans-serif;
        background: var(--background);
        color: var(--foreground);
        letter-spacing: -0.02em;
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      .serif {
        font-family: Fraunces, Georgia, serif;
      }
      .mono,
      code,
      kbd {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 0.875rem;
      }
      .h1 {
        font-size: 2.25rem;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.045em;
      }
      .h2 {
        font-size: 1.75rem;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.045em;
      }
      .h3 {
        font-size: 1.25rem;
        line-height: 1.3;
        font-weight: 600;
      }
      .h4 {
        font-size: 1rem;
        line-height: 1.4;
        font-weight: 600;
      }
      .lg {
        font-size: 1.125rem;
      }
      .sm {
        font-size: 0.875rem;
        line-height: 1.5;
      }
      .cap {
        font-size: 0.75rem;
        line-height: 1.4;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 15rem;
        flex: none;
        background: var(--sidebar);
        border-right: 1px solid var(--sidebar-border);
        padding: var(--md);
        display: flex;
        flex-direction: column;
        gap: var(--md);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      .sidebar .brand {
        padding: var(--xs) var(--sm);
      }
      .group label {
        display: block;
        padding: 0 var(--sm);
        font-size: 0.75rem;
        color: var(--muted-foreground);
        font-weight: 500;
        margin-bottom: var(--xs);
      }
      .group a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.35rem var(--sm);
        border-radius: calc(var(--radius) - 4px);
        color: inherit;
        text-decoration: none;
        font-size: 0.875rem;
      }
      .group a.active {
        background: var(--sidebar-accent);
        font-weight: 500;
      }
      .badge {
        font-size: 0.7rem;
        padding: 0.05rem 0.4rem;
        border-radius: 999px;
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .topbar {
        height: 3rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--md);
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      .content {
        max-width: 48rem;
        margin: 0 auto;
        padding: var(--xl) var(--md);
      }
      .content.wide {
        max-width: 64rem;
      }
      .content.full {
        max-width: none;
        padding: 0;
      }
      .card {
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        height: 2.25rem;
        padding: 0 var(--md);
        border-radius: calc(var(--radius) - 2px);
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      .btn.secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .btn.outline {
        background: transparent;
        border-color: var(--border);
        color: var(--foreground);
      }
      .btn.ghost {
        background: transparent;
        color: var(--foreground);
      }
      .btn.destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
      }
      .btn.sm {
        height: 1.9rem;
        padding: 0 0.75rem;
        font-size: 0.8rem;
      }
      .btn.lg {
        height: 2.6rem;
        padding: 0 1.25rem;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .input {
        height: 2.25rem;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        padding: 0 0.75rem;
        font: inherit;
        font-size: 0.875rem;
        color: inherit;
        width: 100%;
      }
      .row {
        display: flex;
        gap: var(--sm);
        flex-wrap: wrap;
        align-items: center;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: var(--sm);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--md);
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--md);
      }
      .section {
        margin-bottom: var(--xl);
        display: flex;
        flex-direction: column;
        gap: var(--md);
      }
      .swatch {
        height: 3.5rem;
        border-radius: calc(var(--radius) - 2px);
        border: 1px solid var(--border);
        display: flex;
        align-items: flex-end;
        padding: var(--sm);
        font-size: 0.75rem;
      }
      .demo {
        background: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--xl);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 9rem;
        position: relative;
      }
      .sandbox {
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        position: relative;
        background: var(--background);
      }
      .sandbox > .tag {
        position: absolute;
        top: -0.6rem;
        left: var(--md);
        background: var(--background);
        padding: 0 0.4rem;
        font-size: 0.7rem;
        color: var(--muted-foreground);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .sandbox .inner {
        padding: var(--lg);
      }
      .frame {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .frame .head {
        display: flex;
        gap: var(--xs);
        padding: var(--xs) var(--sm);
        border-bottom: 1px solid var(--border);
        background: var(--muted);
        font-size: 0.75rem;
      }
      .frame .head span {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        color: var(--muted-foreground);
      }
      .frame .head span.on {
        background: var(--card);
        color: var(--foreground);
        border: 1px solid var(--border);
      }
      .frame .body {
        padding: var(--xl);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 8rem;
        background: var(--card);
      }
      .split2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .split2 > div {
        padding: var(--lg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .split2 > div + div {
        border-left: 1px solid var(--border);
      }
      .layers {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: var(--md);
        align-items: stretch;
      }
      .layers .card {
        padding: var(--md);
      }
      .layers .arrow {
        display: flex;
        align-items: center;
        color: var(--muted-foreground);
      }
      .meta {
        display: flex;
        gap: var(--lg);
        flex-wrap: wrap;
        font-size: 0.875rem;
        padding: var(--sm) 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .meta dt {
        color: var(--muted-foreground);
        font-size: 0.75rem;
      }
      .meta dd {
        margin: 0;
      }
      .anchors {
        position: sticky;
        top: 0;
        background: var(--background);
        z-index: 5;
        display: flex;
        gap: var(--xs);
        border-bottom: 1px solid var(--border);
        padding: var(--xs) 0;
        margin-bottom: var(--lg);
      }
      .anchors a {
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        font-size: 0.8rem;
        color: var(--muted-foreground);
        text-decoration: none;
      }
      .anchors a:hover {
        background: var(--muted);
        color: var(--foreground);
      }
      .toc a {
        color: inherit;
        text-decoration: none;
      }
      .toc a:hover {
        color: var(--foreground);
      }
      .linkrow a {
        color: inherit;
        font-size: 0.875rem;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .alt {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--md);
      }
      .alt .card {
        padding: var(--md);
      }
      .mini {
        width: 100%;
        max-width: 38rem;
        display: grid;
        grid-template-columns: 10rem 1fr;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--card);
        text-align: left;
      }
      .mini .side {
        background: var(--sidebar);
        border-right: 1px solid var(--sidebar-border);
        padding: var(--md);
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .mini .side b {
        font-family: Fraunces, serif;
        font-size: 1rem;
      }
      .mini .side span.on {
        background: var(--sidebar-accent);
        border-radius: 6px;
        padding: 0.15rem 0.4rem;
        margin: 0 -0.4rem;
      }
      .mini .body {
        padding: var(--md);
        display: flex;
        flex-direction: column;
        gap: var(--sm);
      }
      .switch {
        width: 2.2rem;
        height: 1.25rem;
        border-radius: 999px;
        background: var(--primary);
        position: relative;
        display: inline-block;
      }
      .switch::after {
        content: "";
        position: absolute;
        right: 2px;
        top: 2px;
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        background: var(--background);
      }
      .check {
        width: 1rem;
        height: 1rem;
        border-radius: 4px;
        background: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        color: var(--primary-foreground);
      }
      html {
        scroll-behavior: smooth;
      }
      .demo .tag {
        position: absolute;
        top: var(--sm);
        left: var(--sm);
        font-size: 0.7rem;
        color: var(--muted-foreground);
      }
      .tabs {
        display: flex;
        gap: var(--xs);
        border-bottom: 1px solid var(--border);
      }
      .tabs span {
        padding: var(--sm) var(--md);
        font-size: 0.875rem;
        color: var(--muted-foreground);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs span.on {
        color: var(--foreground);
        border-color: var(--foreground);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th,
      td {
        text-align: left;
        padding: var(--sm);
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--muted-foreground);
        font-weight: 500;
      }
      .rule {
        display: flex;
        flex-direction: column;
        gap: var(--sm);
      }
      .rule .src {
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      .ex {
        display: flex;
        flex-direction: column;
        gap: var(--xs);
      }
      .ex .box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--md);
      }
      .ex .capn {
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      .ex .do {
        color: var(--foreground);
        font-weight: 500;
      }
      .ex .dont {
        color: var(--destructive);
        font-weight: 500;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.75rem;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .toc {
        position: sticky;
        top: var(--xl);
        font-size: 0.8rem;
        color: var(--muted-foreground);
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .toc b {
        color: var(--foreground);
        font-weight: 500;
      }
      .layout-toc {
        display: grid;
        grid-template-columns: 1fr 10rem;
        gap: var(--x2);
      }
      .layout-rail {
        display: grid;
        grid-template-columns: 1fr 16rem;
        gap: var(--xl);
      }
      .rail {
        position: sticky;
        top: var(--xl);
        align-self: start;
        display: flex;
        flex-direction: column;
        gap: var(--md);
      }
      .rail .card {
        padding: var(--md);
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 0.75rem;
        font-size: 0.875rem;
      }
      .kv dt {
        color: var(--muted-foreground);
      }
      .kv dd {
        margin: 0;
      }
      .checklist {
        display: flex;
        flex-direction: column;
        gap: var(--sm);
      }
      .checklist .item {
        display: grid;
        grid-template-columns: 1.25rem 1fr;
        gap: var(--sm);
        align-items: start;
      }
      .checklist .tick {
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        margin-top: 0.2rem;
      }
      details {
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
        padding: var(--sm) var(--md);
      }
      summary {
        cursor: pointer;
        font-size: 0.875rem;
      }
      .bar {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        background: #111;
        color: #fff;
        border-radius: 999px;
        padding: 0.4rem 0.6rem;
        display: flex;
        gap: 0.6rem;
        align-items: center;
        font-size: 0.8rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        z-index: 50;
        font-family: Geist, system-ui;
      }
      .bar button {
        background: transparent;
        border: 1px solid #444;
        color: #fff;
        border-radius: 999px;
        width: 1.7rem;
        height: 1.7rem;
        cursor: pointer;
      }

  <body>

    <div class="bar">
      <button id="prev">←</button>

      <button id="next">→</button>
      <select id="pagesel">
        <option value="overview">Overview</option>
        <option value="colors">Colors (foundation)</option>
        <option value="button">Button (component)</option>
        <option value="mechanic">Primitives (mechanic)</option>
        <option value="preview">Cards (preview)</option>

    <script>
      const V = {
        A: "Final. The agreed page format",
        B: "Playground. Prop controls on demos, token hover shows the pair, filterable parts list",
        C: "Conditions. Width presets and RTL in the toolbar, contrast badges on tokens",
      };
      const q = new URLSearchParams(location.search);
      let variant = q.get("variant") || "A";
      let page = q.get("page") || "overview";
      if (q.get("theme") === "dark")
        document.documentElement.classList.add("dark");

      // ---- color helpers ----
      const cv = document.createElement("canvas");
      cv.width = cv.height = 1;
      const cx = cv.getContext("2d");
      function hexFromCss(c) {
        cx.clearRect(0, 0, 1, 1);
        cx.fillStyle = c;
        cx.fillRect(0, 0, 1, 1);
        const d = cx.getImageData(0, 0, 1, 1).data;
        return (
          "#" +
          [d[0], d[1], d[2]]
            .map((n) => n.toString(16).padStart(2, "0"))
            .join("")
        );
      }
      const hexOf = (el, prop) =>
        hexFromCss(getComputedStyle(el).getPropertyValue(prop).trim());
      function lum(hex) {
        const c = [1, 3, 5]
          .map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
          .map((v) =>
            v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4),
          );
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      function contrast(a, b) {
        const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);
        return ((x + 0.05) / (y + 0.05)).toFixed(1);
      }
      function fillHex() {
        document.querySelectorAll(".tokbox").forEach((b) => {
          const hx = b.querySelector(".hx");
          if (!hx) return;
          const bg = hexOf(b, "--_bg");
          hx.textContent = bg;
          hx.onclick = (e) => {
            e.stopPropagation();
            navigator.clipboard?.writeText(bg);
            hx.textContent = "copied";
            setTimeout(() => (hx.textContent = bg), 800);
          };
          const ct = b.querySelector(".ctr");
          if (ct) {
            const fg = hexOf(b, "--_fg");
            const r = contrast(bg, fg);
            ct.textContent = r + ":1";
            ct.title = "contrast against its foreground";
            ct.style.opacity = r >= 4.5 ? 1 : 0.6;
          }
        });
      }

      // ---- the preview container ----
      let fid = 0;
      function frame(panes, opts = {}) {
        const id = "f" + fid++;
        const names = Object.keys(panes);
        const showTabs = opts.tabs !== false && names.length > 1;
        const tabs = showTabs
          ? names
              .map(
                (n, i) =>
                  `<span class="${i ? "" : "on"}" data-f="${id}" data-p="${i}">${n}</span>`,
              )
              .join("")
          : "";
        const bodies = names
          .map((n, i) => {
            const p = panes[n];
            const isCode = typeof p === "string" && p.startsWith("CODE:");
            return isCode
              ? `<div class="code" data-fb="${id}" data-p="${i}" ${i ? 'style="display:none"' : ""}><pre class="mono">${p.slice(5)}</pre></div>`
              : `<div class="body ${opts.body || ""}" data-fb="${id}" data-p="${i}" ${i ? 'style="display:none"' : ""}>${p}</div>`;
          })
          .join("");
        let tools = "";
        if (opts.tools)
          tools +=
            `<span class="sp"></span>` +
            (opts.widths
              ? `<span class="ic" data-fw="${id}" data-w="w-s" title="narrow">S</span><span class="ic" data-fw="${id}" data-w="w-m" title="medium">M</span><span class="ic" data-fw="${id}" data-w="" title="full">L</span><span class="ic" data-frtl="${id}" title="right to left">RTL</span>`
              : "") +
            `<span class="ic" title="toggle theme inside the frame" data-ft="${id}">◐</span><span class="ic" title="split light and dark" data-fs="${id}">▯▯</span>`;
        const head =
          tabs || tools
            ? `<div class="head ${tabs ? "" : "tools-only"}">${tabs}${tools}</div>`
            : "";
        const props = opts.props
          ? `<div class="props">${opts.props}</div>`
          : "";
        return `<div class="frame" id="${id}">${head}${bodies}${props}</div>`;
      }
      function splitHtml(inner) {
        return `<div class="split2"><div class="light" style="background:var(--background);color:var(--foreground)">${inner}</div><div class="dark" style="background:var(--background);color:var(--foreground)">${inner}</div></div>`;
      }
      function wireFrames() {
        document.querySelectorAll(".frame .head span[data-f]").forEach(
          (t) =>
            (t.onclick = () => {
              const id = t.dataset.f,
                p = t.dataset.p;
              document
                .querySelectorAll(`#${id} .head span[data-f]`)
                .forEach((x) => x.classList.toggle("on", x === t));
              document
                .querySelectorAll(`[data-fb="${id}"]`)
                .forEach(
                  (b) => (b.style.display = b.dataset.p === p ? "" : "none"),
                );
            }),
        );
        document.querySelectorAll("[data-ft]").forEach(
          (t) =>
            (t.onclick = () => {
              const f = document.getElementById(t.dataset.ft);
              f.classList.toggle("dark");
              f.classList.toggle("light", !f.classList.contains("dark"));
              fillHex();
            }),
        );
        document.querySelectorAll("[data-fs]").forEach(
          (t) =>
            (t.onclick = () => {
              const f = document.getElementById(t.dataset.fs);
              f.querySelectorAll(".body").forEach((b) => {
                if (b.dataset.split) {
                  b.innerHTML = b.dataset.split;
                  delete b.dataset.split;
                  b.classList.remove("none");
                } else {
                  b.dataset.split = b.innerHTML;
                  b.classList.add("none");
                  b.innerHTML = splitHtml(b.dataset.split);
                }
              });
              fillHex();
            }),
        );
        document.querySelectorAll("[data-fw]").forEach(
          (t) =>
            (t.onclick = () => {
              document
                .getElementById(t.dataset.fw)
                .querySelectorAll(".body")
                .forEach((b) => {
                  b.classList.remove("w-s", "w-m");
                  if (t.dataset.w) b.classList.add(t.dataset.w);
                });
            }),
        );
        document.querySelectorAll("[data-frtl]").forEach(
          (t) =>
            (t.onclick = () =>
              document
                .getElementById(t.dataset.frtl)
                .querySelectorAll(".body")
                .forEach((b) => b.classList.toggle("rtl"))),
        );
        // B: button props
        const pf = document.getElementById("propsFrame");
        if (pf) {
          const upd = () => {
            const v = document.getElementById("pv").value,
              sz = document.getElementById("ps").value,
              dis = document.getElementById("pd").checked,
              txt = document.getElementById("pt").value;
            document
              .querySelectorAll("#propsFrame .body")
              .forEach(
                (b) =>
                  (b.innerHTML = `<button class="btn ${v} ${sz}" ${dis ? "disabled" : ""}>${txt}</button>`),
              );
            document.querySelector("#propsFrame .code pre").innerHTML =
              `&lt;Button${v !== "default" ? ` variant="${v}"` : ""}${sz !== "default" ? ` size="${sz}"` : ""}${dis ? " disabled" : ""}&gt;${txt}&lt;/Button&gt;`;
          };
          ["pv", "ps", "pd", "pt"].forEach(
            (i) => (document.getElementById(i).oninput = upd),
          );
          upd();
        }
        // B: token hover highlights its pair
        document.querySelectorAll(".tokbox[data-pair]").forEach((b) => {
          b.onmouseenter = () =>
            document
              .querySelectorAll(`.tokbox[data-name="${b.dataset.pair}"]`)
              .forEach((x) => x.classList.add("pairhl"));
          b.onmouseleave = () =>
            document
              .querySelectorAll(".pairhl")
              .forEach((x) => x.classList.remove("pairhl"));
        });
        // more list
        document.querySelectorAll("[data-more]").forEach(
          (c) =>
            (c.onclick = () => {
              const l = document.getElementById(c.dataset.more);
              l.style.display = l.style.display === "none" ? "" : "none";

        document.getElementById("crumb").textContent = {

          colors: "Foundations / Colors",
          button: "Components / Button",
          mechanic: "Mechanics / Primitives",
          preview: "Previews / Cards",
        }[page];
        document
          .querySelectorAll("[data-page]")
          .forEach((a) =>
            a.classList.toggle("active", a.dataset.page === page),
          );
        document.getElementById("pagesel").value = page;
        const u = new URL(location);
        u.searchParams.set("variant", variant);
        u.searchParams.set("page", page);
        history.replaceState(null, "", u);
        wireFrames();
        fillHex();
        scrollTo(0, 0);
      }
      const keys = Object.keys(V);
      const step = (d) => {
        variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length];
        render();
      };
      document.getElementById("prev").onclick = () => step(-1);
      document.getElementById("next").onclick = () => step(1);
      document.getElementById("pagesel").onchange = (e) => {
        page = e.target.value;
        render();
      };
      document.querySelectorAll("[data-page]").forEach(
        (a) =>
          (a.onclick = (e) => {
            e.preventDefault();
            page = a.dataset.page;
            render();
          }),
      );
      document.getElementById("theme").onclick = () => {
        document.documentElement.classList.toggle("dark");
        fillHex();
      };
      addEventListener("keydown", (e) => {
        if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))
          return;
        if (e.key === "ArrowLeft") step(-1);
        if (e.key === "ArrowRight") step(1);
      });
      render();
    </script>
  </body>
</html>
